name: BetterConsole
options:
  bundleIdPrefix: app.betterconsole
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  BetterConsoleKit:
    path: Packages/BetterConsoleKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Local ad-hoc signing (no team). Hardened Runtime stays on.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  BetterConsole:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Wi-Fi device streaming (BCMobileDevice): macOS asks for Local Network access.
        NSLocalNetworkUsageDescription: BetterConsole streams logs from your iPhone or iPad over Wi-Fi.
        # The builder's private row drag (App/Filter/Editor/BuilderDrag.swift).
        # Log files open in their own windows (App/Files/LogFileWindows.swift).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Log File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.log
              - com.apple.log
              - public.plain-text
              - public.json
              - public.ndjson
              - app.betterconsole.jsonl
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.betterconsole.jsonl
            UTTypeDescription: JSON Lines
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [jsonl]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.betterconsole.builder-node
            UTTypeDescription: BetterConsole filter row
            UTTypeConformsTo: [public.data]
    scheme:
      testTargets:
        - BetterConsoleTests
    dependencies:
      - package: BetterConsoleKit
        product: BCModel
      - package: BetterConsoleKit
        product: BCStore
      - package: BetterConsoleKit
        product: BCTransport
      - package: BetterConsoleKit
        product: BCStreaming
      - package: BetterConsoleKit
        product: BCMobileDevice
      - package: BetterConsoleKit
        product: BCFilter
      - package: BetterConsoleKit
        product: BCFiles
    settings:
      base:
        PRODUCT_NAME: BetterConsole
        PRODUCT_BUNDLE_IDENTIFIER: app.betterconsole.BetterConsole
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BetterConsole
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/BetterConsole.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  BetterConsoleTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/BetterConsoleTests
      # Pure App sources under test, compiled into the bundle (no app host, so no streaming).
      - path: App/LogView/LogTimestampFormatter.swift
      - path: App/LogView/FollowTracker.swift
      - path: App/LogView/LogColumns.swift
      - path: App/LogView/RowCopy.swift
      - path: App/Files/LogFileText.swift
      - path: App/Filter/Editor/EditorText.swift
      - path: App/Filter/Editor/EditorUndoRouting.swift
      - path: App/Filter/Editor/PredicateTextMapping.swift
      - path: App/Filter/Editor/BuilderDrag.swift
    dependencies:
      - package: BetterConsoleKit
        product: BCModel
      - package: BetterConsoleKit
        product: BCFilter
      - package: BetterConsoleKit
        product: BCFiles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.betterconsole.BetterConsoleTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
